# Generated by matugen from yonux/shell/matugen/templates/tmux-colors.conf.
# Source this file from the user's tmux configuration.

set -g status-style "bg={{colors.surface_container.dark.hex}},fg={{colors.on_surface.dark.hex}}"
set -g message-style "bg={{colors.secondary_container.dark.hex}},fg={{colors.on_secondary_container.dark.hex}}"
set -g message-command-style "bg={{colors.tertiary_container.dark.hex}},fg={{colors.on_tertiary_container.dark.hex}}"
set -g mode-style "bg={{colors.primary.dark.hex}},fg={{colors.on_primary.dark.hex}}"

set -g pane-border-style "fg={{colors.outline_variant.dark.hex}}"
set -g pane-active-border-style "fg={{colors.primary.dark.hex}}"

set -g window-status-style "bg={{colors.surface_container.dark.hex}},fg={{colors.on_surface_variant.dark.hex}}"
set -g window-status-current-style "bg={{colors.primary.dark.hex}},fg={{colors.on_primary.dark.hex}},bold"
set -g window-status-last-style "fg={{colors.secondary.dark.hex}}"
set -g window-status-activity-style "fg={{colors.tertiary.dark.hex}},bold"
set -g window-status-bell-style "bg={{colors.error.dark.hex}},fg={{colors.on_error.dark.hex}},bold"

set -g status-left-style "fg={{colors.primary.dark.hex}},bold"
set -g status-right-style "fg={{colors.on_surface_variant.dark.hex}}"
set -g clock-mode-colour "{{colors.primary.dark.hex}}"
