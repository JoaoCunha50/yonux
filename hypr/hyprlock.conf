# Temporary lock screen until yonux has its own (Quickshell WlSessionLock).
# Colours and wallpaper are rendered by matugen from
# yonux-shell/matugen/templates/hyprlock-colors.conf; the defaults below cover a
# login before the first wallpaper. autostart.lua makes sure the file exists.
$wallpaper = screenshot
$primary = rgb(89b4fa)
$surface = rgb(1e1e2e)
$on_surface = rgb(cdd6f4)
$error = rgb(f38ba8)
source = ~/.cache/yonux/hyprlock-colors.conf

$font = Google Sans Flex

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = $wallpaper
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
}

label {
    monitor =
    text = $TIME
    font_family = $font
    font_size = 96
    color = $on_surface
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +'%A, %d %B'
    font_family = $font
    font_size = 20
    color = $on_surface
    position = 0, 60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    rounding = 10
    outer_color = $primary
    inner_color = $surface
    font_color = $on_surface
    check_color = $primary
    fail_color = $error
    font_family = $font
    placeholder_text = Password
    fade_on_empty = false
    dots_center = true
    position = 0, -80
    halign = center
    valign = center
}
